<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ölçüt yoksa her parçayı sen kontrol edersin ve Claude seni bekler. Ölçüt varsa Claude komutu koşturur, düzeltir ve kendi döngüsünde ilerler" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" fill="var(--fg,#17202c)">
<defs><marker id="b02-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--soft,#5b6472)"/></marker></defs>
