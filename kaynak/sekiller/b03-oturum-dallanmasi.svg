<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oturum komutları bir zaman çizgisinde: ana oturum, /fork ile arka plana kopya, /branch ile kopyaya geçiş, /rewind ile geri sarma, /clear ile boş pencere, --continue ile ertesi gün aynı oturuma dönüş" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" fill="var(--fg,#17202c)">
<defs><marker id="b03-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--soft,#5b6472)"/></marker></defs>
<text x="30" y="124" font-size="13" font-weight="700" fill="var(--acc,#1d4f91)">bu oturum</text>
<path d="M30 150H476" fill="none" stroke="var(--acc,#1d4f91)" stroke-width="3"/>
<g fill="var(--acc,#1d4f91)"><circle cx="60" cy="150" r="6"/><circle cx="140" cy="150" r="6"/><circle cx="220" cy="150" r="6"/><circle cx="380" cy="150" r="6"/><circle cx="460" cy="150" r="6"/></g>
<circle cx="300" cy="150" r="10" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="3"/>
<text x="290" y="178" text-anchor="end" font-size="13" fill="var(--soft,#5b6472)">dallanma noktası</text>
<path d="M300 140C300 110 326 72 360 72H480" fill="none" stroke="var(--ile,#6a4a9c)" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="330" y="34" font-size="13" font-weight="700" fill="var(--fg,#17202c)">/fork</text>
<text x="330" y="52" font-size="13" fill="var(--soft,#5b6472)">kopya arka planda koşar, sen yerinde kalırsın</text>
<path d="M300 160C300 205 326 250 360 250H480" fill="none" stroke="var(--ok,#1f7a4d)" stroke-width="2.5"/>
<text x="330" y="282" font-size="13" font-weight="700" fill="var(--fg,#17202c)">/branch</text>
<text x="330" y="300" font-size="13" fill="var(--soft,#5b6472)">kopyaya geçersin, eskisine /resume ile dönersin</text>
<path d="M458 142C446 112 396 112 382 142" fill="none" stroke="var(--fg,#17202c)" stroke-width="2" marker-end="url(#b03-ok)"/>
<text x="420" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg,#17202c)">/rewind</text>
<path d="M140 158C140 200 96 214 84 240" fill="none" stroke="var(--soft,#5b6472)" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#b03-ok)"/>
<circle cx="76" cy="254" r="11" fill="var(--yuzey,#ffffff)" stroke="var(--soft,#5b6472)" stroke-width="2" stroke-dasharray="3 3"/>
<text x="30" y="290" font-size="13" font-weight="700" fill="var(--fg,#17202c)">/clear</text>
<text x="30" y="308" font-size="13" fill="var(--soft,#5b6472)">boş pencere,</text>
<text x="30" y="326" font-size="13" fill="var(--soft,#5b6472)">eskisi /resume'da kalır</text>
<path d="M504 150H588" fill="none" stroke="var(--acc,#1d4f91)" stroke-width="3" stroke-dasharray="3 6"/>
<line x1="490" y1="138" x2="490" y2="162" stroke="var(--soft,#5b6472)" stroke-width="2"/>
<circle cx="600" cy="150" r="8" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="3"/>
<text x="548" y="132" text-anchor="middle" font-size="13" fill="var(--soft,#5b6472)">ertesi gün</text>
<text x="590" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg,#17202c)">--continue</text>
<text x="590" y="202" text-anchor="middle" font-size="13" fill="var(--soft,#5b6472)">aynı pencere</text>
</svg>
