<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gece koşumunun üç evresi: akşam ön koşulları, gece tekrar başlatılabilir adımlar, sabah kanıt okuma" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
<style>@media (prefers-reduced-motion: no-preference){.b10-s{animation:b10-yan 10s infinite both}.b10-s1{animation-delay:0s}.b10-s2{animation-delay:3s}.b10-s3{animation-delay:6s}@keyframes b10-yan{0%{opacity:.3}5%{opacity:1}62%{opacity:1}70%{opacity:.3}100%{opacity:.3}}}</style><defs><marker id="b10-gece-kosumu-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--soft,#5b6472)"/></marker></defs>
<path d="M24 34H606" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b10-gece-kosumu-m)"/><g class="b10-s b10-s1"><circle cx="106" cy="34" r="14" fill="var(--accbg,#e6eef9)" stroke="var(--acc,#1d4f91)" stroke-width="1.8"/><text x="106" y="39" font-size="14" font-weight="700" fill="var(--acc,#1d4f91)" text-anchor="middle">1</text><rect x="10" y="64" width="192" height="176" rx="12" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="1.6"/><text x="26" y="92" font-size="16" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">Akşam</text><text x="26" y="112" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">ayrılmadan önce</text><text x="26" y="142" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">izin listesi dolu mu</text><text x="26" y="166" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">disk: df -h</text><text x="26" y="190" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">yük: uptime</text><text x="26" y="214" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">uyku ve şarj: pmset</text></g><g class="b10-s b10-s2"><circle cx="320" cy="34" r="14" fill="var(--accbg,#e6eef9)" stroke="var(--acc,#1d4f91)" stroke-width="1.8"/><text x="320" y="39" font-size="14" font-weight="700" fill="var(--acc,#1d4f91)" text-anchor="middle">2</text><rect x="224" y="64" width="192" height="176" rx="12" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="1.6"/><text x="240" y="92" font-size="16" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">Gece</text><text x="240" y="112" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">sen yokken</text><text x="240" y="142" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">ara çıktı diske yazılır</text><text x="240" y="166" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">biten adım atlanır</text><text x="240" y="190" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">izin isteyen adım sona</text><text x="240" y="214" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">geri alınamaz: engelli</text></g><g class="b10-s b10-s3"><circle cx="534" cy="34" r="14" fill="var(--accbg,#e6eef9)" stroke="var(--acc,#1d4f91)" stroke-width="1.8"/><text x="534" y="39" font-size="14" font-weight="700" fill="var(--acc,#1d4f91)" text-anchor="middle">3</text><rect x="438" y="64" width="192" height="176" rx="12" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="1.6"/><text x="454" y="92" font-size="16" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">Sabah</text><text x="454" y="112" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">kanıtı oku</text><text x="454" y="142" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">exit-code.txt: 0</text><text x="454" y="166" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">is_error: false</text><text x="454" y="190" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">çıktı dosyası var</text><text x="454" y="214" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">log'un son satırı</text></g><rect x="10" y="256" width="620" height="50" rx="12" fill="var(--ilebg,#f0eaf8)" stroke="var(--ile,#6a4a9c)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="26" y="278" font-size="14" font-weight="700" fill="var(--ile,#6a4a9c)" text-anchor="start">Kanıtlardan biri eksikse iş bitmiş sayılmaz.</text><text x="26" y="296" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">Hata yoksa ve log boşsa iş ya bitti ya hiç başlamadı; dışarıdan ikisi aynı görünür.</text></svg>
