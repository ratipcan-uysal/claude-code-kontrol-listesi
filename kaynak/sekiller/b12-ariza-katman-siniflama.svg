<svg viewBox="0 0 640 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Başarısızlığı katmana göre ayırma: önce harness engeli, sonra kuralın bağlamda olup olmadığı; sonuç bağlam, model kararı ya da harness">
