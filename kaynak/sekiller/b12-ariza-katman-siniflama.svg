<rect x="20" y="125" width="300" height="70" rx="12" fill="var(--yuzey,#ffffff)" stroke="var(--line,#e1e5eb)" stroke-width="1.5"/>
<text x="38" y="150" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="var(--fg,#17202c)" text-anchor="start">Claude kuralı bağlamda gördü mü?</text>
<text x="38" y="172" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="var(--soft,#5b6472)" text-anchor="start">/context ve /memory ile bak</text>
