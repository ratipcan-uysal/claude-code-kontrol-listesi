<rect x="20" y="15" width="300" height="70" rx="12" fill="var(--yuzey,#ffffff)" stroke="var(--line,#e1e5eb)" stroke-width="1.5"/>
<text x="38" y="40" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="var(--fg,#17202c)" text-anchor="start">Komut çalışmadı, izin istedi,</text>
