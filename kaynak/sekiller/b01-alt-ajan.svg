<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alt ajan ayrı bir bağlam penceresinde çalışır: ana oturumdan devir mesajı alır, geriye özet döndürür" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" fill="var(--fg,#17202c)">
