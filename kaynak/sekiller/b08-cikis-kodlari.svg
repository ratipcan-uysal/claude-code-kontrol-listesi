<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hook çıkış kodları: 0 karar yok, 2 engeller, diğer kodlar engellemeyen hata" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
<defs><marker id="b08-cikis-kodlari-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--soft,#5b6472)"/></marker></defs>
<rect x="10" y="80" width="128" height="70" rx="12" fill="var(--accbg,#e6eef9)" stroke="var(--acc,#1d4f91)" stroke-width="1.8"/><text x="74" y="108" font-size="15" font-weight="700" fill="var(--fg,#17202c)" text-anchor="middle">Hook betiği</text><text x="74" y="130" font-size="13" fill="var(--soft,#5b6472)" text-anchor="middle">çıkış kodu</text><path d="M138 115C160 115 160 40 178 40" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b08-cikis-kodlari-m)"/><rect x="180" y="22" width="62" height="36" rx="10" fill="var(--yuzey,#ffffff)" stroke="var(--soft,#5b6472)" stroke-width="1.6"/><text x="211" y="46" font-size="14" font-weight="700" fill="var(--soft,#5b6472)" text-anchor="middle">0</text><rect x="258" y="12" width="366" height="56" rx="10" fill="var(--yuzey,#ffffff)" stroke="var(--soft,#5b6472)" stroke-width="1.6"/><text x="274" y="35" font-size="15" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">Karar yok</text><text x="274" y="55" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">normal izin akışı sürer, sessizlik onay değildir</text><path d="M138 115C160 115 160 120 178 120" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b08-cikis-kodlari-m)"/><rect x="180" y="102" width="62" height="36" rx="10" fill="var(--yuzey,#ffffff)" stroke="var(--acc,#1d4f91)" stroke-width="1.6"/><text x="211" y="126" font-size="14" font-weight="700" fill="var(--acc,#1d4f91)" text-anchor="middle">2</text><rect x="258" y="92" width="366" height="56" rx="10" fill="var(--accbg,#e6eef9)" stroke="var(--acc,#1d4f91)" stroke-width="1.6"/><text x="274" y="115" font-size="15" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">İşlemi durdurur</text><text x="274" y="135" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">stderr gerekçe olur ve Claude'a gider</text><path d="M138 115C160 115 160 200 178 200" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b08-cikis-kodlari-m)"/><rect x="180" y="182" width="62" height="36" rx="10" fill="var(--yuzey,#ffffff)" stroke="var(--ile,#6a4a9c)" stroke-width="1.6"/><text x="211" y="206" font-size="14" font-weight="700" fill="var(--ile,#6a4a9c)" text-anchor="middle">diğer</text><rect x="258" y="172" width="366" height="56" rx="10" fill="var(--ilebg,#f0eaf8)" stroke="var(--ile,#6a4a9c)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="274" y="195" font-size="15" font-weight="700" fill="var(--fg,#17202c)" text-anchor="start">Engellemeyen hata</text><text x="274" y="215" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">işlem yine yapılır, yalnız bildirim çıkar</text><text x="16" y="258" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">Güvenlik kapısı olan hook için üçüncü satır istenmez: hatada engellemeyi betikte yaz.</text></svg>
