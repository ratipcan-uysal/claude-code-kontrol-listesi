<svg viewBox="0 0 640 334" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skill ana konuşmaya eklenir, alt ajan ayrı pencerede çalışır, MCP dış sisteme bağlar, plugin hepsini paketler" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif">
