xt-anchor="start">Claude'un göremediği dış sistem</text><text x="374" y="218" font-size="13" fill="var(--soft,#5b6472)" text-anchor="start">araç olarak görünür</text><path d="M296 44H354" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b07-kap-secimi-m)"/><text x="325" y="36" font-size="13" fill="var(--soft,#5b6472)" text-anchor="middle">görev</text><path d="M354 90H298" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b07-kap-secimi-m)"/><text x="325" y="112" font-size="13" fill="var(--soft,#5b6472)" text-anchor="middle">özet</text><path d="M296 196H354" fill="none" stroke="var(--soft,#5b6472)" stroke-width="1.5" marker-end="url(#b07-kap-secimi-m)"/><text x="325" y="188" font-size="13" fill="var(--soft,#5b6472)" text-anchor="middle">araç</text><rect x="16" y="262" width="608" height="56" rx="14" fill="var(--ilebg,#f0eaf8)" stroke="var(--ile,#6a4a9c)" stroke-width="1.8" stroke-dasharray="6 4"/><text x="34" y="286" font-size="15" font-weight="700" fill="var(--ile,#6a4a9c)" text-anchor="start">Plugin</text><text x="34" y="306" font-size="13" fill="var(--fg,#17202c)" text-anchor="start">skill, ajan, hook ve MCP'yi tek kurulumda taşır; içindekilerin yerini almaz</text></svg>
